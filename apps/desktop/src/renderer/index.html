<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy.

      Diagram blocks that require runtime evaluation (function-plot,
      jsxgraph, mermaid) are rendered inside sandboxed iframes with their
      own relaxed CSP, allowing the main renderer to enforce a strict
      script-src policy without 'unsafe-eval'.

      style-src keeps 'unsafe-inline' because React inline styles and
      Tailwind arbitrary values emit inline style attributes.

      frame-ancestors 'none' prevents the renderer from being embedded by
      another document. object-src / base-uri / form-action are all locked
      down. Navigation is additionally gated by setWindowOpenHandler and
      will-navigate in the main process.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: zen-asset: zen-theme:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: zen-asset: zen-theme:; media-src 'self' data: blob: zen-asset: zen-theme:; frame-src 'self' data: blob: zen-asset: https://www.youtube-nocookie.com https://player.vimeo.com; font-src 'self' data: zen-theme: zen-excalidraw:; worker-src 'self' blob:; connect-src 'self' zen-asset: zen-theme: zen-excalidraw: zen-typst:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; manifest-src 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenNotes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>

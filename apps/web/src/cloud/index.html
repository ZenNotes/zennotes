<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      ZenNotes in your browser. Its Content Security Policy comes from the
      response headers (vite.cloud.config.ts for local serving; the website's
      host-scoped route in production), never from a meta tag here.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>ZenNotes</title>
  </head>
  <body>
    <div id="zn-host-banner"></div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

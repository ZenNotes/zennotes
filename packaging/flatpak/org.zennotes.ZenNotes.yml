app-id: org.zennotes.ZenNotes
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: zennotes
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  # Notes are plain Markdown files on disk — allow access to the home dir.
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: zennotes
    buildsystem: simple
    build-commands:
      # Unpack the official AppImage. `--appimage-extract` uses the embedded
      # squashfs extractor and needs no FUSE, so it runs inside the build sandbox.
      - chmod +x ZenNotes.AppImage
      - ./ZenNotes.AppImage --appimage-extract
      # Install icons from the AppImage's hicolor tree, renamed to the app-id.
      - |
        for s in 16 24 32 48 64 128 256 512; do
          install -Dm644 "squashfs-root/usr/share/icons/hicolor/${s}x${s}/apps/ZenNotes.png" \
            "/app/share/icons/hicolor/${s}x${s}/apps/org.zennotes.ZenNotes.png"
        done
      # Copy the unpacked Electron app into /app, dropping AppImage-only bits.
      - mkdir -p /app/zennotes
      - cp -a squashfs-root/. /app/zennotes/
      - rm -rf /app/zennotes/usr /app/zennotes/AppRun /app/zennotes/.DirIcon
          /app/zennotes/ZenNotes.png /app/zennotes/ZenNotes.desktop
      # The SUID chrome-sandbox is unusable in Flatpak; zypak handles sandboxing.
      - rm -f /app/zennotes/chrome-sandbox
      - chmod -R a+rX /app/zennotes
      - install -Dm755 zennotes.sh /app/bin/zennotes
      - install -Dm644 org.zennotes.ZenNotes.desktop
          /app/share/applications/org.zennotes.ZenNotes.desktop
      - install -Dm644 org.zennotes.ZenNotes.metainfo.xml
          /app/share/metainfo/org.zennotes.ZenNotes.metainfo.xml
    sources:
      # `url` + `sha256` are auto-bumped on each release by Flathub's
      # flatpak-external-data-checker (see x-checker-data below); the manual
      # steps in README.md are the fallback.
      - type: file
        url: https://github.com/ZenNotes/zennotes/releases/download/v2.13.1/ZenNotes-2.13.1-linux-x86_64.AppImage
        sha256: bbf3015fbc5fc775ce229e53f7f4977ce20a29fcd82e9737d7b10d5d8f8a4bdb
        dest-filename: ZenNotes.AppImage
        x-checker-data:
          type: json
          url: https://api.github.com/repos/ZenNotes/zennotes/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: >-
            .assets[] | select(.name | test("linux-x86_64\\.AppImage$"))
            | .browser_download_url
      - type: file
        path: zennotes.sh
      - type: file
        path: org.zennotes.ZenNotes.desktop
      - type: file
        path: org.zennotes.ZenNotes.metainfo.xml

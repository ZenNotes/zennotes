name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Reject high-severity production advisories
        run: npm audit --omit=dev --audit-level=high

  # The scoped MCP tests against a real server, built from the server's main
  # branch. The tests skip without the binary, and a server that stops marking
  # links would only skip them too, so this job requires the marks.
  server-contract:
    name: Server contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      ZENNOTES_SERVER_CONTRACT_BINARY: ${{ github.workspace }}/.znserver-bin/zennotes-server
      ZENNOTES_SERVER_CONTRACT_REQUIRE_MARKS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out the server
        uses: actions/checkout@v7
        with:
          repository: ZenNotes/znserver
          ref: main
          path: .znserver

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Build the server
        working-directory: .znserver
        run: go build -trimpath -o "$ZENNOTES_SERVER_CONTRACT_BINARY" ./cmd/zennotes-server

      - name: Install dependencies
        run: npm ci

      - name: Run the scoped MCP tests against it
        working-directory: apps/desktop
        run: npx vitest run src/mcp/scoped-backend-links.test.ts src/mcp/scoped-backend-local-links.test.ts

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # GitHub's free arm64 Linux runner for public repos.
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          # And its Windows counterpart, where the ARM64 release build comes
          # from (#928).
          - windows-11-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify terminal artifacts and legacy launchers
        if: runner.os != 'Windows'
        run: node --test tooling/scripts/terminal-artifact.test.mjs tooling/scripts/terminal-launcher.test.mjs

      - name: Verify standalone shared packages
        run: npm run test:shared-packages

      - name: Verify isolated editor package and assets
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:app-core-package

      - name: Exercise the installed editor in Chrome
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:app-core-browser

      - name: Verify the editor with the mobile Vite version
        if: matrix.os == 'ubuntu-latest'
        env:
          ZEN_CORE_VITE_VERSION: 8.2.2
        run: npm run test:app-core-package

      - name: Exercise the Vite 8 editor in Chrome
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:app-core-browser

      - name: Collect browser evidence
        if: always() && matrix.os == 'ubuntu-latest'
        run: node tooling/scripts/collect-app-core-evidence.mjs "$RUNNER_TEMP/app-core-browser-evidence"

      - name: Retain browser evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: app-core-browser-evidence
          path: ${{ runner.temp }}/app-core-browser-evidence
          if-no-files-found: ignore

      - name: Verify browser asset build lock
        run: npm run test:web-dist-lock

      - name: Typecheck and build app
        run: npm run build:prod

      - name: Package the ARM64 Windows app and check it launches
        if: matrix.os == 'windows-11-arm'
        shell: bash
        # No maintainer has an ARM64 Windows machine, so this is where the
        # native build is proven to start before a release ships it (#928):
        # a CDP page target, the app drawn, and an ARM64 executable.
        run: |
          npm exec --workspace @zennotes/desktop -- electron-builder --win dir --arm64 --publish never
          node tooling/scripts/packaged-launch-check.mjs dist/win-arm64-unpacked/ZenNotes.exe --expect-arch arm64
